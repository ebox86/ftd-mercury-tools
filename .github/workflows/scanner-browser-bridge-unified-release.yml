name: Scanner Browser Bridge Unified Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version (example: 1.2.0)"
        required: true
        type: string
  push:
    tags:
      - "scanner-browser-bridge-unified-v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version metadata
        id: meta
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $refName = "${{ github.ref_name }}"
            $prefix = "scanner-browser-bridge-unified-v"
            if (-not $refName.StartsWith($prefix)) {
              throw "Tag must use prefix '$prefix'. Got: $refName"
            }
            $version = $refName.Substring($prefix.Length)
          }

          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid version format: $version"
          }

          $tag = "scanner-browser-bridge-unified-v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version=$version"
          Write-Host "Tag=$tag"

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate PowerShell scripts
        run: |
          $files = @(
            "scanner-browser-bridge/tools/build-unified-installer.ps1",
            "scanner-browser-bridge/installer/scripts/install-opos-bridge-unified.ps1",
            "scanner-browser-bridge/installer/scripts/uninstall-opos-bridge-unified.ps1",
            "scanner-browser-bridge/service/install-opos-bridge-service.ps1",
            "scanner-browser-bridge/service/install-opos-bridge-task.ps1",
            "scanner-browser-bridge/service/migrate-script-bridge-to-service.ps1"
          )
          foreach ($file in $files) {
            $raw = Get-Content -Raw -Path $file
            [void][scriptblock]::Create($raw)
            Write-Host "Parsed OK: $file"
          }

      - name: Verify installer and project files exist
        run: |
          if (-not (Test-Path "scanner-browser-bridge/installer/FTD.OposBridge.Unified.iss")) { throw "Missing unified installer project." }
          if (-not (Test-Path "scanner-browser-bridge/service/FTD.OposBridge.Service/FTD.OposBridge.Service.csproj")) { throw "Missing service csproj." }

      - name: Install Inno Setup compiler
        run: choco install innosetup --no-progress -y

      - name: Build unified installer
        run: |
          $publisherUrl = "https://github.com/${{ github.repository }}"
          .\scanner-browser-bridge\tools\build-unified-installer.ps1 `
            -Version "${{ steps.meta.outputs.version }}" `
            -Publisher "ebox86.com" `
            -PublisherUrl $publisherUrl

      - name: Hash installer
        id: hash
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $installer = Join-Path $PWD "scanner-browser-bridge\dist\FTD.OposBridge.Unified.Setup.$version.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer not found: $installer"
          }

          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToUpperInvariant()
          $hashFile = "$installer.sha256.txt"
          Set-Content -Path $hashFile -Value "$hash  $(Split-Path -Leaf $installer)"

          "installer=$installer" >> $env:GITHUB_OUTPUT
          "hash=$hash" >> $env:GITHUB_OUTPUT
          "hash_file=$hashFile" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Scanner Browser Bridge Unified ${{ steps.meta.outputs.version }}
          make_latest: false
          files: |
            ${{ steps.hash.outputs.installer }}
            ${{ steps.hash.outputs.hash_file }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: scanner-browser-bridge-unified-installer-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.hash.outputs.installer }}
            ${{ steps.hash.outputs.hash_file }}
