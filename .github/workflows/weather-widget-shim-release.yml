name: Weather Widget Shim Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version (example: 1.2.0)"
        required: true
        type: string
  push:
    tags:
      - "weather-widget-shim-v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version metadata
        id: meta
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $refName = "${{ github.ref_name }}"
            $prefix = "weather-widget-shim-v"
            if (-not $refName.StartsWith($prefix)) {
              throw "Tag must use prefix '$prefix'. Got: $refName"
            }
            $version = $refName.Substring($prefix.Length)
          }

          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid version format: $version"
          }

          $tag = "weather-widget-shim-v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version=$version"
          Write-Host "Tag=$tag"

      - name: Validate PowerShell install scripts
        run: |
          $files = @(
            "weather-widget-shim/scripts/install-weather-xoap-shim.ps1",
            "weather-widget-shim/scripts/uninstall-weather-xoap-shim.ps1",
            "weather-widget-shim/scripts/smoke-test-weather-xoap-shim.ps1",
            "weather-widget-shim/tools/build-installer.ps1"
          )
          foreach ($file in $files) {
            $raw = Get-Content -Raw -Path $file
            [void][scriptblock]::Create($raw)
            Write-Host "Parsed OK: $file"
          }

      - name: Verify shim site files exist
        run: |
          if (-not (Test-Path "weather-widget-shim/site/web.config")) { throw "Missing weather-widget-shim/site/web.config" }
          if (-not (Test-Path "weather-widget-shim/site/App_Code/WeatherShimHandler.cs")) { throw "Missing WeatherShimHandler.cs" }

      - name: Install Inno Setup compiler
        run: choco install innosetup --no-progress -y

      - name: Build Weather Widget shim installer
        run: |
          $publisherUrl = "https://github.com/${{ github.repository }}"
          .\weather-widget-shim\tools\build-installer.ps1 `
            -Version "${{ steps.meta.outputs.version }}" `
            -Publisher "FTD" `
            -PublisherUrl $publisherUrl

      - name: Hash installer
        id: hash
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $installer = Join-Path $PWD "weather-widget-shim\dist\FTD.WeatherXoapShim.Setup.$version.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer not found: $installer"
          }

          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToUpperInvariant()
          $hashFile = "$installer.sha256.txt"
          Set-Content -Path $hashFile -Value "$hash  $(Split-Path -Leaf $installer)"

          "installer=$installer" >> $env:GITHUB_OUTPUT
          "hash=$hash" >> $env:GITHUB_OUTPUT
          "hash_file=$hashFile" >> $env:GITHUB_OUTPUT

      - name: Prepare release notes
        id: notes
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $installerFile = "FTD.WeatherXoapShim.Setup.$version.exe"
          $hash = "${{ steps.hash.outputs.hash }}"
          $notesPath = Join-Path $env:RUNNER_TEMP "weather-widget-shim-release-notes.md"

          @"
          Weather Widget Shim installer release.

          Included assets:
          - $installerFile
          - $installerFile.sha256.txt

          SHA256:
          - $hash
          "@ | Set-Content -Path $notesPath

          "body_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Weather Widget Shim ${{ steps.meta.outputs.version }}
          body_path: ${{ steps.notes.outputs.body_path }}
          make_latest: false
          generate_release_notes: false
          files: |
            ${{ steps.hash.outputs.installer }}
            ${{ steps.hash.outputs.hash_file }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-widget-shim-installer-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.hash.outputs.installer }}
            ${{ steps.hash.outputs.hash_file }}
