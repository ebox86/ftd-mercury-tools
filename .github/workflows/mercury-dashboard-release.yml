name: Mercury Dashboard Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version (example: 1.2.0)"
        required: true
        type: string
  push:
    tags:
      - "mercury-dashboard-v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    env:
      NODE_RUNTIME_VERSION: v20.19.0

    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version metadata
        id: meta
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $refName = "${{ github.ref_name }}"
            $prefix = "mercury-dashboard-v"
            if (-not $refName.StartsWith($prefix)) {
              throw "Tag must use prefix '$prefix'. Got: $refName"
            }
            $version = $refName.Substring($prefix.Length)
          }

          if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid version format: $version"
          }

          $tag = "mercury-dashboard-v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version=$version"
          Write-Host "Tag=$tag"

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Stamp kiosk app version
        working-directory: mercury-orders-tv-dashboard/kiosk-app
        run: npm version "${{ steps.meta.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install kiosk dependencies
        working-directory: mercury-orders-tv-dashboard/kiosk-app
        run: npm ci

      - name: Build kiosk app
        working-directory: mercury-orders-tv-dashboard/kiosk-app
        run: npm run build

      - name: Verify bridge and web host scripts
        run: |
          node --check mercury-orders-tv-dashboard/workflow-bridge/server.mjs
          node --check mercury-orders-tv-dashboard/service-host/dashboard-web-server.mjs

      - name: Validate PowerShell installer scripts
        run: |
          $files = @(
            "mercury-orders-tv-dashboard/service/install-mercury-dashboard-services.ps1",
            "mercury-orders-tv-dashboard/service/uninstall-mercury-dashboard-services.ps1",
            "mercury-orders-tv-dashboard/tools/build-installer.ps1"
          )
          foreach ($file in $files) {
            $raw = Get-Content -Raw -Path $file
            [void][scriptblock]::Create($raw)
            Write-Host "Parsed OK: $file"
          }

      - name: Build dashboard service host
        run: |
          dotnet build mercury-orders-tv-dashboard/service-host/FTD.Mercury.Dashboard.ServiceHost/FTD.Mercury.Dashboard.ServiceHost.csproj -c Release

      - name: Install Inno Setup compiler
        run: choco install innosetup --no-progress -y

      - name: Download installer tooling (Node runtime)
        id: tooling
        run: |
          $toolsRoot = Join-Path $PWD "mercury-orders-tv-dashboard\artifacts\tooling"
          if (-not (Test-Path $toolsRoot)) {
            New-Item -ItemType Directory -Path $toolsRoot | Out-Null
          }

          function Invoke-DownloadWithRetry {
            param(
              [Parameter(Mandatory = $true)] [string]$Uri,
              [Parameter(Mandatory = $true)] [string]$OutFile,
              [int]$Attempts = 3,
              [int]$DelaySeconds = 3
            )

            $lastError = $null
            for ($attempt = 1; $attempt -le $Attempts; $attempt++) {
              try {
                if (Test-Path $OutFile) {
                  Remove-Item -Force $OutFile
                }
                Invoke-WebRequest -Uri $Uri -OutFile $OutFile
                return
              }
              catch {
                $lastError = $_
                if ($attempt -lt $Attempts) {
                  Start-Sleep -Seconds $DelaySeconds
                }
              }
            }

            if ($null -ne $lastError) {
              throw $lastError
            }

            throw "Download failed for $Uri"
          }

          $nodeZipName = "node-$env:NODE_RUNTIME_VERSION-win-x64.zip"
          $nodeZip = Join-Path $toolsRoot $nodeZipName
          $nodeExtract = Join-Path $toolsRoot "node-runtime"
          Invoke-DownloadWithRetry -Uri "https://nodejs.org/dist/$env:NODE_RUNTIME_VERSION/$nodeZipName" -OutFile $nodeZip
          if (Test-Path $nodeExtract) {
            Remove-Item -Recurse -Force $nodeExtract
          }
          Expand-Archive -Path $nodeZip -DestinationPath $nodeExtract -Force

          $nodeRuntimeDir = Join-Path $nodeExtract "node-$env:NODE_RUNTIME_VERSION-win-x64"
          if (-not (Test-Path (Join-Path $nodeRuntimeDir "node.exe"))) {
            throw "node.exe not found in extracted runtime: $nodeRuntimeDir"
          }

          "node_runtime_dir=$nodeRuntimeDir" >> $env:GITHUB_OUTPUT

      - name: Build Mercury dashboard installer
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN || vars.MAPBOX_TOKEN || secrets.MAPBOX_ACCESS_TOKEN || vars.MAPBOX_ACCESS_TOKEN }}
        run: |
          $publisherUrl = "https://github.com/${{ github.repository }}"
          $mapboxToken = "$env:MAPBOX_TOKEN"
          if ([string]::IsNullOrWhiteSpace($mapboxToken)) {
            throw "MAPBOX_TOKEN is empty; set repository/environment secret or variable MAPBOX_TOKEN for production installer address lookup."
          }

          if ($mapboxToken -match '(?i)^(MAPBOX_TOKEN|MAPBOX_ACCESS_TOKEN)\s*=\s*(.*)$') {
            $mapboxToken = $Matches[2].Trim()
          }
          if (($mapboxToken.StartsWith('"') -and $mapboxToken.EndsWith('"')) -or ($mapboxToken.StartsWith("'") -and $mapboxToken.EndsWith("'"))) {
            $mapboxToken = $mapboxToken.Substring(1, $mapboxToken.Length - 2).Trim()
          }

          function Read-WebResponseBody {
            param($Response)

            if ($null -eq $Response) {
              return ""
            }

            try {
              if ($Response.Content) {
                if ($Response.Content -is [byte[]]) {
                  return [System.Text.Encoding]::UTF8.GetString($Response.Content)
                }
                if ($Response.Content.PSObject.Methods.Name -contains "ReadAsStringAsync") {
                  return $Response.Content.ReadAsStringAsync().GetAwaiter().GetResult()
                }
                return [string]$Response.Content
              }

              if ($Response.PSObject.Methods.Name -notcontains "GetResponseStream") {
                return ""
              }

              $stream = $Response.GetResponseStream()
              if ($null -eq $stream) {
                return ""
              }

              $reader = [System.IO.StreamReader]::new($stream)
              return $reader.ReadToEnd()
            } catch {
              return ""
            }
          }

          function Invoke-MapboxValidationRequest {
            param(
              [Parameter(Mandatory = $true)] [string]$Name,
              [Parameter(Mandatory = $true)] [string]$Uri
            )

            try {
              return Invoke-WebRequest -Uri $Uri -Method Get -TimeoutSec 20
            } catch {
              $status = ""
              $body = ""
              $errorResponse = $null
              if ($_.Exception.PSObject.Properties.Name -contains "Response") {
                $errorResponse = $_.Exception.Response
              }
              if ($null -ne $errorResponse) {
                try { $status = " HTTP $([int]$errorResponse.StatusCode)" } catch { $status = "" }
                $body = (Read-WebResponseBody $errorResponse).Trim()
              }

              if ($body.Length -gt 240) {
                $body = $body.Substring(0, 240)
              }

              $bodySuffix = ""
              if ($body) {
                $bodySuffix = " Body: $body"
              }

              throw "MAPBOX_TOKEN validation failed for ${Name}.${status} $($_.Exception.Message)$bodySuffix"
            }
          }

          function Get-JsonPropertyValue {
            param(
              [Parameter(Mandatory = $true)] $Object,
              [Parameter(Mandatory = $true)] [string]$Name
            )

            if ($null -eq $Object) {
              return $null
            }

            $property = $Object.PSObject.Properties[$Name]
            if ($null -eq $property) {
              return $null
            }

            return $property.Value
          }

          function Test-MapboxGeocoding {
            param([Parameter(Mandatory = $true)] [string]$Token)

            $queries = @(
              "1600 Pennsylvania Ave NW Washington DC 20500",
              "608 Foreland Street Pittsburgh PA 15212",
              "1222 E Carson St Pittsburgh PA 15203"
            )

            foreach ($query in $queries) {
              $encodedQuery = [System.Uri]::EscapeDataString($query)
              $encodedToken = [System.Uri]::EscapeDataString($Token)
              $uri = "https://api.mapbox.com/search/geocode/v6/forward?q=$encodedQuery&country=US&limit=1&autocomplete=false&types=address,street,place,postcode&access_token=$encodedToken"
              $response = Invoke-MapboxValidationRequest -Name "Mapbox v6 forward geocoding" -Uri $uri
              $bodyText = Read-WebResponseBody $response
              $json = $bodyText | ConvertFrom-Json
              $features = Get-JsonPropertyValue -Object $json -Name "features"
              $featureCount = 0
              if ($null -ne $features) {
                $featureCount = @($features).Count
              }

              if ($featureCount -gt 0) {
                Write-Host "MAPBOX_TOKEN v6 geocoding validated with $featureCount match(es)."
                return
              }

              Write-Host "Mapbox v6 validation query returned no matches: $query"
            }

            throw "MAPBOX_TOKEN validation returned no v6 geocoding results for validation queries."
          }

          $encodedMapboxToken = [System.Uri]::EscapeDataString($mapboxToken)
          Test-MapboxGeocoding -Token $mapboxToken

          $staticMapUri = "https://api.mapbox.com/styles/v1/mapbox/streets-v12/static/pin-s+176b87(-79.999037,40.454896)/-79.999037,40.454896,13,0/320x180@2x?access_token=$encodedMapboxToken&attribution=false&logo=false"
          [void](Invoke-MapboxValidationRequest -Name "Mapbox Static Images" -Uri $staticMapUri)
          Write-Host "MAPBOX_TOKEN secret validated for release build geocoding and static maps."

          .\mercury-orders-tv-dashboard\tools\build-installer.ps1 `
            -Version "${{ steps.meta.outputs.version }}" `
            -Publisher "ebox86.com" `
            -PublisherUrl $publisherUrl `
            -NodeRuntimeDir "${{ steps.tooling.outputs.node_runtime_dir }}" `
            -MapboxToken $mapboxToken

      - name: Hash installer
        id: hash
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $installer = Join-Path $PWD "mercury-orders-tv-dashboard\dist\FTD.MercuryDashboard.Setup.$version.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer not found: $installer"
          }

          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToUpperInvariant()
          $hashFile = "$installer.sha256.txt"
          Set-Content -Path $hashFile -Value "$hash  $(Split-Path -Leaf $installer)"

          "installer=$installer" >> $env:GITHUB_OUTPUT
          "hash=$hash" >> $env:GITHUB_OUTPUT
          "hash_file=$hashFile" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Mercury Dashboard ${{ steps.meta.outputs.version }}
          make_latest: false
          files: |
            ${{ steps.hash.outputs.installer }}
            ${{ steps.hash.outputs.hash_file }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mercury-dashboard-installer-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.hash.outputs.installer }}
            ${{ steps.hash.outputs.hash_file }}
