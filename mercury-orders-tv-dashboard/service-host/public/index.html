<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talaria</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f3f4f8;
    padding: 16px;
  }
  .card {
    width: min(480px, 100%);
    background: #fff;
    border-radius: 16px;
    padding: 44px 40px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
    text-align: center;
  }
  .logo-box {
    width: 96px;
    height: 96px;
    margin: 0 auto 20px;
    border-radius: 22px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 26px;
    color: #1a1d29;
    letter-spacing: 0.02em;
  }
  p.sub {
    margin: 0 0 32px;
    font-size: 14px;
    color: #666d84;
  }
  .buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.btn {
    display: block;
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
    padding: 18px;
    border-radius: 10px;
    transition: transform 0.05s ease;
  }
  a.btn:active { transform: scale(0.99); }
  a.btn-dashboard { background: #ff6b00; color: #fff; box-shadow: 0 2px 10px rgba(255, 107, 0, 0.33); }
  a.btn-dashboard:hover { background: #e05f00; }
  a.btn-admin { background: #eef0f7; color: #1a1d29; }
  a.btn-admin:hover { background: #e3e5f2; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-box">
      <img id="logo" alt="Talaria" onerror="this.parentElement.style.display='none'">
    </div>
    <h1>Talaria</h1>
    <p class="sub">Mercury order tracking and delivery dashboard.</p>
    <div class="buttons">
      <a class="btn btn-dashboard" id="dashboard-link">Dashboard</a>
      <a class="btn btn-admin" id="admin-link">Admin</a>
    </div>
  </div>
  <script>
    // This page can be served bare (site root) or behind a reverse proxy at
    // a subpath (e.g. IIS at /Talaria/) - compute that prefix explicitly
    // rather than trusting relative-URL resolution, which silently breaks
    // if the current URL is missing its trailing slash at click time.
    var prefix = window.location.pathname.replace(/\/+$/, '');
    document.getElementById('logo').src = prefix + '/talaria-icon.jpg';
    document.getElementById('dashboard-link').href = prefix + '/dashboard/';
    document.getElementById('admin-link').href = prefix + '/admin/';
  </script>
</body>
</html>
